<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphLUT - Static CUDA Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 overflow-hidden">
    <header class="flex justify-between items-center mb-4 shrink-0">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="crosshair" class="text-blue-400"></i> GraphLUT <span class="text-blue-600 font-normal">CUDA Edition</span>
        </h1>
        <div class="flex gap-2">
            <select id="lutSize" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                <option value="1024">1024 entries</option>
                <option value="2048">2048 entries</option>
                <option value="4096">4096 entries</option>
            </select>
            <select id="outputType" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                <option value="float">Float</option>
                <option value="int">Int</option>
                <option value="uint8">UInt8</option>
            </select>
            <button id="uploadBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i data-lucide="camera" size="18"></i> Load Image
            </button>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
        </div>
    </header>

    <div class="flex flex-1 gap-6 min-h-0">
        <!-- Main Canvas Area -->
        <div class="flex-[3] flex flex-col gap-2 min-h-0 bg-slate-900 rounded-xl border border-slate-800 relative overflow-hidden">
            <div id="emptyState" class="flex flex-col items-center justify-center h-full text-slate-700">
                <i data-lucide="maximize-2" size="64" class="mb-4 opacity-10"></i>
                <p>Upload a graph image to start</p>
            </div>
            <div id="editorArea" class="hidden relative w-full h-full flex items-center justify-center p-16">
                <div class="relative inline-block border border-slate-700 bg-black cursor-crosshair" id="imgContainer">
                    <img id="graphImg" class="max-h-[70vh] max-w-full block pointer-events-none select-none">
                    <svg id="overlaySvg" class="absolute inset-0 w-full h-full pointer-events-none overflow-visible">
                        <line id="lineXMin" stroke="#eab308" stroke-width="1" stroke-dasharray="4 4" x1="10%" y1="0" x2="10%" y2="100%"></line>
                        <line id="lineXMax" stroke="#eab308" stroke-width="1" stroke-dasharray="4 4" x1="90%" y1="0" x2="90%" y2="100%"></line>
                        <line id="lineYMin" stroke="#eab308" stroke-width="1" stroke-dasharray="4 4" x1="0" y1="90%" x2="100%" y2="90%"></line>
                        <line id="lineYMax" stroke="#eab308" stroke-width="1" stroke-dasharray="4 4" x1="0" y1="10%" x2="100%" y2="10%"></line>
                        <polyline id="curvePath" fill="none" stroke="#60a5fa" stroke-width="2.5"></polyline>
                    </svg>
                    
                    <!-- Drag Handles -->
                    <div id="handleXMin" class="drag-handle absolute top-[-14px] w-7 h-7 bg-yellow-500 rounded-full border-2 border-white cursor-ew-resize -translate-x-1/2 flex items-center justify-center shadow-lg z-20 hover:scale-110 transition-all text-[10px] text-black font-bold select-none" style="left: 10%">X1</div>
                    <div id="handleXMax" class="drag-handle absolute top-[-14px] w-7 h-7 bg-yellow-500 rounded-full border-2 border-white cursor-ew-resize -translate-x-1/2 flex items-center justify-center shadow-lg z-20 hover:scale-110 transition-all text-[10px] text-black font-bold select-none" style="left: 90%">X2</div>
                    <div id="handleYMin" class="drag-handle absolute left-[-14px] w-7 h-7 bg-yellow-500 rounded-full border-2 border-white cursor-ns-resize -translate-y-1/2 flex items-center justify-center shadow-lg z-20 hover:scale-110 transition-all text-[10px] text-black font-bold select-none" style="top: 90%">Y1</div>
                    <div id="handleYMax" class="drag-handle absolute left-[-14px] w-7 h-7 bg-yellow-500 rounded-full border-2 border-white cursor-ns-resize -translate-y-1/2 flex items-center justify-center shadow-lg z-20 hover:scale-110 transition-all text-[10px] text-black font-bold select-none" style="top: 10%">Y2</div>
                    
                    <div id="pointsLayer"></div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="w-80 flex flex-col gap-4 overflow-hidden">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h3 class="text-xs font-bold mb-4 flex items-center gap-2 text-slate-400 uppercase tracking-widest"><i data-lucide="settings-2" size="14"></i> Scale Calibration</h3>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500">X1 Value</label>
                        <input type="number" id="valXMin" value="0" class="w-full bg-slate-800 p-2 rounded text-sm border border-slate-700 focus:border-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500">X2 Value</label>
                        <input type="number" id="valXMax" value="10" class="w-full bg-slate-800 p-2 rounded text-sm border border-slate-700 focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500">Y1 Value</label>
                        <input type="number" id="valYMin" value="0" class="w-full bg-slate-800 p-2 rounded text-sm border border-slate-700 focus:border-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500">Y2 Value</label>
                        <input type="number" id="valYMax" value="100" class="w-full bg-slate-800 p-2 rounded text-sm border border-slate-700 focus:border-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 rounded-xl border border-slate-800 flex flex-col flex-1 min-h-0 overflow-hidden">
                <div class="flex text-[11px] border-b border-slate-800">
                    <button id="tabX2Y" class="flex-1 p-3 font-bold text-blue-400 bg-blue-400/5 transition-colors">X → Y</button>
                    <button id="tabY2X" class="flex-1 p-3 font-bold text-slate-500 hover:bg-slate-800/50 transition-colors">Y → X</button>
                </div>
                <div id="lutContainer" class="flex-1 overflow-y-auto p-3 font-mono text-[10px] custom-scrollbar">
                    <div id="lutGrid" class="grid grid-cols-2 gap-x-4 gap-y-0.5"></div>
                </div>
                <div class="p-3 border-t border-slate-800 bg-slate-900/50">
                    <button id="copyBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded text-xs font-bold flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95">
                        <i data-lucide="code" size="14"></i> Copy CUDA Array
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // State
        let state = {
            calib: { xMin: 10, xMax: 90, yMin: 90, yMax: 10 },
            scale: { xMin: 0, xMax: 10, yMin: 0, yMax: 100 },
            points: [],
            activeTab: 'x2y',
            renderedImgSize: { w: 0, h: 0 }
        };

        const elements = {
            fileInput: document.getElementById('fileInput'),
            uploadBtn: document.getElementById('uploadBtn'),
            graphImg: document.getElementById('graphImg'),
            editorArea: document.getElementById('editorArea'),
            emptyState: document.getElementById('emptyState'),
            imgContainer: document.getElementById('imgContainer'),
            lutGrid: document.getElementById('lutGrid'),
            lutSize: document.getElementById('lutSize'),
            outputType: document.getElementById('outputType'),
            copyBtn: document.getElementById('copyBtn'),
            tabX2Y: document.getElementById('tabX2Y'),
            tabY2X: document.getElementById('tabY2X'),
            curvePath: document.getElementById('curvePath'),
            pointsLayer: document.getElementById('pointsLayer'),
            // Value inputs
            valXMin: document.getElementById('valXMin'),
            valXMax: document.getElementById('valXMax'),
            valYMin: document.getElementById('valYMin'),
            valYMax: document.getElementById('valYMax')
        };

        // Initialize Upload
        elements.uploadBtn.onclick = () => elements.fileInput.click();
        elements.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                elements.graphImg.src = ev.target.result;
                elements.emptyState.classList.add('hidden');
                elements.editorArea.classList.remove('hidden');
                state.points = [];
                updateUI();
            };
            reader.readAsDataURL(file);
        };

        // Handle Image Click for Points
        elements.imgContainer.onclick = (e) => {
            if (e.target !== elements.imgContainer && e.target !== elements.graphImg) return;
            const rect = elements.imgContainer.getBoundingClientRect();
            state.points.push({ id: Date.now(), px: e.clientX - rect.left, py: e.clientY - rect.top });
            updateUI();
        };

        // Generic Drag Logic
        function setupDrag(handleId, calibKey, isX) {
            const handle = document.getElementById(handleId);
            const line = document.getElementById('line' + calibKey.charAt(0).toUpperCase() + calibKey.slice(1));
            
            handle.onmousedown = (e) => {
                e.preventDefault(); e.stopPropagation();
                const startX = e.clientX;
                const startY = e.clientY;
                const startVal = state.calib[calibKey];
                
                const onMouseMove = (me) => {
                    const rect = elements.imgContainer.getBoundingClientRect();
                    const dx = ((me.clientX - startX) / rect.width) * 100;
                    const dy = ((me.clientY - startY) / rect.height) * 100;
                    const newVal = Math.max(0, Math.min(100, startVal + (isX ? dx : dy)));
                    state.calib[calibKey] = newVal;
                    
                    handle.style[isX ? 'left' : 'top'] = newVal + '%';
                    line.setAttribute(isX ? 'x1' : 'y1', newVal + '%');
                    line.setAttribute(isX ? 'x2' : 'y2', newVal + '%');
                    updateUI();
                };
                
                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };
                
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };
        }

        setupDrag('handleXMin', 'xMin', true);
        setupDrag('handleXMax', 'xMax', true);
        setupDrag('handleYMin', 'yMin', false);
        setupDrag('handleYMax', 'yMax', false);

        // UI Update Loop
        function updateUI() {
            const rect = elements.imgContainer.getBoundingClientRect();
            state.renderedImgSize = { w: rect.width, h: rect.height };
            
            // Sync Scales
            state.scale.xMin = parseFloat(elements.valXMin.value) || 0;
            state.scale.xMax = parseFloat(elements.valXMax.value) || 1;
            state.scale.yMin = parseFloat(elements.valYMin.value) || 0;
            state.scale.yMax = parseFloat(elements.valYMax.value) || 1;

            // Draw Curve
            const sortedPoints = [...state.points].sort((a, b) => a.px - b.px);
            elements.curvePath.setAttribute('points', sortedPoints.map(p => `${p.px},${p.py}`).join(' '));

            // Render Points
            elements.pointsLayer.innerHTML = '';
            state.points.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'absolute w-4 h-4 bg-blue-500 rounded-full -translate-x-1/2 -translate-y-1/2 ring-2 ring-white cursor-pointer z-10 hover:scale-125 transition-transform shadow-md';
                dot.style.left = p.px + 'px';
                dot.style.top = p.py + 'px';
                dot.onclick = (e) => {
                    e.stopPropagation();
                    state.points = state.points.filter(pt => pt.id !== p.id);
                    updateUI();
                };
                elements.pointsLayer.appendChild(dot);
            });

            renderLUT();
        }

        function getValuesFromPixels(px, py) {
            const { w, h } = state.renderedImgSize;
            const xMinPx = (state.calib.xMin / 100) * w;
            const xMaxPx = (state.calib.xMax / 100) * w;
            const yMinPx = (state.calib.yMin / 100) * h;
            const yMaxPx = (state.calib.yMax / 100) * h;
            
            const x = state.scale.xMin + (px - xMinPx) * (state.scale.xMax - state.scale.xMin) / (xMaxPx - xMinPx || 1);
            const y = state.scale.yMin + (py - yMinPx) * (state.scale.yMax - state.scale.yMin) / (yMaxPx - yMinPx || 1);
            return { x, y };
        }

        function getPixelsFromValues(x, y) {
            const { w, h } = state.renderedImgSize;
            const xMinPx = (state.calib.xMin / 100) * w;
            const xMaxPx = (state.calib.xMax / 100) * w;
            const yMinPx = (state.calib.yMin / 100) * h;
            const yMaxPx = (state.calib.yMax / 100) * h;

            const px = xMinPx + (x - state.scale.xMin) * (xMaxPx - xMinPx) / (state.scale.xMax - state.scale.xMin || 1);
            const py = yMinPx + (y - state.scale.yMin) * (yMaxPx - yMinPx) / (state.scale.yMax - state.scale.yMin || 1);
            return { px, py };
        }

        function interpolate(pxTarget) {
            const pts = [...state.points].sort((a, b) => a.px - b.px);
            if (pts.length < 2) return null;
            if (pxTarget < pts[0].px || pxTarget > pts[pts.length - 1].px) return null;
            
            for (let i = 0; i < pts.length - 1; i++) {
                if (pxTarget >= pts[i].px && pxTarget <= pts[i+1].px) {
                    const p1 = pts[i], p2 = pts[i+1];
                    const ratio = (pxTarget - p1.px) / (p2.px - p1.px || 1);
                    const py = p1.py + ratio * (p2.py - p1.py);
                    return getValuesFromPixels(pxTarget, py);
                }
            }
            return null;
        }

        function formatVal(val) {
            const type = elements.outputType.value;
            if (type === 'float') return val.toFixed(6);
            if (type === 'uint8') return Math.max(0, Math.min(255, Math.round(val)));
            return Math.round(val);
        }

        function renderLUT() {
            const size = parseInt(elements.lutSize.value);
            elements.lutGrid.innerHTML = '';
            
            const lutData = [];
            if (state.activeTab === 'x2y') {
                const step = (state.scale.xMax - state.scale.xMin) / (size - 1);
                for (let i = 0; i < size; i++) {
                    const x = state.scale.xMin + i * step;
                    const { px } = getPixelsFromValues(x, 0);
                    const mapped = interpolate(px);
                    lutData.push(mapped ? formatVal(mapped.y) : "0");
                }
            } else {
                const step = (state.scale.yMax - state.scale.yMin) / (size - 1);
                const ptsInVal = state.points.map(p => getValuesFromPixels(p.px, p.py)).sort((a,b)=>a.y-b.y);
                for (let i = 0; i < size; i++) {
                    const y = state.scale.yMin + i * step;
                    let xFound = "0";
                    for(let j=0; j<ptsInVal.length-1; j++) {
                        const p1 = ptsInVal[j], p2 = ptsInVal[j+1];
                        if ((y >= p1.y && y <= p2.y) || (y <= p1.y && y >= p2.y)) {
                            const ratio = (y - p1.y) / (p2.y - p1.y || 1);
                            xFound = formatVal(p1.x + ratio * (p2.x - p1.x));
                            break;
                        }
                    }
                    lutData.push(xFound);
                }
            }

            lutData.forEach((val, i) => {
                const row = document.createElement('div');
                row.className = 'flex justify-between border-b border-slate-800/50 hover:bg-white/5 px-1';
                row.innerHTML = `<span class="opacity-30">[${i}]</span><span class="text-blue-300">${val}${elements.outputType.value==='float'?'f':''}</span>`;
                elements.lutGrid.appendChild(row);
            });
            
            state.lastLut = lutData;
        }

        // Copy Logic
        elements.copyBtn.onclick = () => {
            const size = elements.lutSize.value;
            const type = elements.outputType.value;
            const typeStr = type === 'float' ? 'float' : type === 'uint8' ? 'unsigned char' : 'int';
            const name = state.activeTab === 'x2y' ? 's_lutX2Y' : 's_lutY2X';
            const suffix = type === 'float' ? 'f' : '';
            const code = `__constant__ ${typeStr} ${name}[${size}] = {\n  ${state.lastLut.map(v => v + suffix).join(', ')}\n};`;
            
            const el = document.createElement('textarea');
            el.value = code;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const originalText = elements.copyBtn.innerHTML;
            elements.copyBtn.innerText = "Copied!";
            setTimeout(() => elements.copyBtn.innerHTML = originalText, 1500);
        };

        // Tabs
        elements.tabX2Y.onclick = () => {
            state.activeTab = 'x2y';
            elements.tabX2Y.className = 'flex-1 p-3 font-bold text-blue-400 bg-blue-400/5 transition-colors';
            elements.tabY2X.className = 'flex-1 p-3 font-bold text-slate-500 hover:bg-slate-800/50 transition-colors';
            updateUI();
        };
        elements.tabY2X.onclick = () => {
            state.activeTab = 'y2x';
            elements.tabY2X.className = 'flex-1 p-3 font-bold text-blue-400 bg-blue-400/5 transition-colors';
            elements.tabX2Y.className = 'flex-1 p-3 font-bold text-slate-500 hover:bg-slate-800/50 transition-colors';
            updateUI();
        };

        // Inputs
        ['valXMin', 'valXMax', 'valYMin', 'valYMax', 'lutSize', 'outputType'].forEach(id => {
            elements[id].oninput = updateUI;
        });

        window.onresize = updateUI;
    </script>
</body>
</html>
